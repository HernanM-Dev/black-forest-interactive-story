<ion-content fullscreen class="intro-background">
  <div class="overlay">
    <div class="intro-container" [class.show]="showContent">
      
      <!-- Icono de audífonos -->
      <div class="headset-icon">
        <ion-icon name="headset-outline"></ion-icon>
      </div>

      <h2 class="intro-title">{{ 'INTRO.TITLE' | translate }}</h2>

      <div class="intro-text">
        <p class="main-text">
          {{ 'INTRO.HEADPHONES' | translate }}
        </p>
        
        <p class="warning-text">
          {{ 'INTRO.WARNING_LINE_1' | translate }}<br>
          {{ 'INTRO.WARNING_LINE_2' | translate }}<br>
          {{ 'INTRO.WARNING_LINE_3' | translate }}
        </p>
      </div>

      <ion-button 
        expand="block" 
        shape="round" 
        class="continue-button"
        (click)="continue()">
        {{ 'INTRO.CONTINUE' | translate }}
      </ion-button>

      <ion-button 
        expand="block" 
        fill="clear" 
        class="back-button"
        (click)="goBack()">
        {{ 'INTRO.BACK' | translate }}
      </ion-button>

    </div>
  </div>
</ion-content>
