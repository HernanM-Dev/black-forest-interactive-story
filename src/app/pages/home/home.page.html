<ion-content fullscreen class="home-background">
  <div class="overlay">
    <div class="home-container">
      <h1 class="title">BLACK FOREST</h1>
      <p class="subtitle">{{ subtitle }}</p>

      <!-- Botón Continuar (solo si hay partida guardada) -->
      <ion-button 
        *ngIf="showButton && hasSavedGame"
        expand="block" 
        shape="round" 
        class="continue-button"
        (click)="continueGame()">
        CONTINUAR
      </ion-button>

      <!-- Botón Nuevo Juego -->
      <ion-button 
        *ngIf="showButton"
        expand="block" 
        shape="round" 
        class="start-button"
        (click)="newGame()">
        NUEVO JUEGO
      </ion-button>

      <ion-button 
        *ngIf="showButton"
        expand="block" 
        fill="clear" 
        class="settings-button"
        (click)="openSettings()">
        Opciones
      </ion-button>
    </div>
  </div>
</ion-content>
